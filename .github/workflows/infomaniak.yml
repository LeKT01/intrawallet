name: Déployer IntraWallet sur Infomaniak
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intrawallet-infomaniak
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: infomaniak
      url: https://intrawallet.nova-studios.ch
    env:
      APP_URL: https://intrawallet.nova-studios.ch
      INFOMANIAK_WEB_ROOT: ${{ vars.INFOMANIAK_WEB_ROOT }}
    steps:
      - name: Vérifier les réglages FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.INFOMANIAK_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.INFOMANIAK_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.INFOMANIAK_FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD INFOMANIAK_WEB_ROOT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Réglage manquant : $name. Voir docs/infomaniak.md."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_MARKET_RELAY_URL: ${{ env.APP_URL }}
      - name: Vérifier le relais PHP et préparer les fichiers
        run: |
          php -l deploy/infomaniak/market.php
          cp deploy/infomaniak/market.php deploy/infomaniak/.htaccess dist/
      - name: Transférer les fichiers en FTPES
        env:
          INFOMANIAK_HOST: ${{ secrets.FTP_SERVER || vars.INFOMANIAK_HOST }}
          INFOMANIAK_USER: ${{ secrets.FTP_USERNAME || vars.INFOMANIAK_USER }}
          INFOMANIAK_FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.INFOMANIAK_FTP_PASSWORD }}
        run: python3 deploy/infomaniak/upload.py
      - name: Vérifier HTTPS et les routes après déploiement
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$APP_URL/" -o /tmp/intrawallet-live.html
          cmp dist/index.html /tmp/intrawallet-live.html
          curl --fail --silent --show-error --max-time 15 "$APP_URL/sw.js" -o /tmp/intrawallet-live-sw.js
          cmp dist/sw.js /tmp/intrawallet-live-sw.js
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$APP_URL/market/eodhd/eod/LLY.US")
          [[ "$status" == 400 ]]
