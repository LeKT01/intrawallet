<!doctype html>
<html lang="fr-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const read = key => {
          try { return localStorage.getItem('portefeuille.' + key) } catch { return null }
        }
        const saved = read('theme')
        const theme = saved === 'dark' || saved === 'light'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const variant = read('theme.' + theme)
        Object.assign(document.documentElement.dataset, {
          theme,
          variant: theme === 'dark' ? ['oled', 'bleu', 'emeraude'].includes(variant) ? variant : 'graphite' : variant === 'champagne' ? 'champagne' : 'coral',
          density: read('density') === 'compact' ? 'compact' : 'comfortable',
        })
      })()
    </script>
    <meta name="description" content="Portefeuille personnel d’actions, ETF et cryptos, stocké sur cet appareil." />
    <meta name="theme-color" content="#78352f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="./app-icons/intrawallet-wallet-64.png" />
    <link rel="apple-touch-icon" href="./app-icons/intrawallet-wallet-180.png" />
    <title>IntraWallet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
